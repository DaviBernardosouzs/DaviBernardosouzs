  </g>
  <text x="49" y="287" class="mono" font-size="17" fill="#79edda" letter-spacing="2">BACKEND &amp; INTELIGÊNCIA ARTIFICIAL</text>
  <text x="49" y="327" class="sans" font-size="17" fill="#9eafbe">Construindo APIs, assistentes e ferramentas com IA.</text>

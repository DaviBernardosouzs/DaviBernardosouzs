  <path d="M890 184L867 208L890 232M934 184L957 208L934 232M921 177L904 239" stroke="#6ef7d3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="969" cy="151" r="4" fill="#6ef7d3" class="pulse"/>
  <g class="mono" font-size="11" letter-spacing="1" fill="#aec2cf">

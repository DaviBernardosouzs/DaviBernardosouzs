  <text x="46" y="412" class="mono" font-size="12" fill="#7898a9">JAVA <tspan fill="#354e5b">/</tspan> SPRING BOOT <tspan fill="#354e5b">/</tspan> PYTHON <tspan fill="#354e5b">/</tspan> LLMs</text>
  <text x="1157" y="412" text-anchor="end" class="mono" font-size="12" fill="#6ef7d3">~/always-learning <tspan class="cursor">▌</tspan></text>

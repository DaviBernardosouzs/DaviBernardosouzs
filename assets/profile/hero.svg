<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Davi Bernardo — Backend e Inteligência Artificial</title>
<desc id="desc">Banner escuro com circuitos animados, um processador e o nome Davi Bernardo. Java, Spring Boot, Python e sistemas com IA.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0a0f19"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#6ef7d3"/><stop offset="1" stop-color="#73adff"/></linearGradient>
  <linearGradient id="chip" x2="1" y2="1"><stop stop-color="#173539"/><stop offset="1" stop-color="#0b1523"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#2dd4bf" stop-opacity=".15"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#72a5b8" stroke-opacity=".065"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="round"><rect x="1" y="1" width="1198" height="438" rx="22"/></clipPath>
</defs>
<style>
  .mono {font-family: 'DejaVu Sans Mono', Consolas, monospace}
  .sans {font-family: 'DejaVu Sans', Arial, sans-serif}
  .flow {stroke-dasharray: 8 180; animation: stream 6s linear infinite}
  .flow2 {animation-delay: -3s}
  .pulse {animation: breathe 4s ease-in-out infinite}
  .cursor {animation: blink 1.6s steps(1) infinite}
  @keyframes stream {to {stroke-dashoffset:-376}}
  @keyframes breathe {50% {opacity:.4}}
  @keyframes blink {50% {opacity:0}}
  @media (prefers-reduced-motion: reduce) {.flow,.pulse,.cursor {animation:none}}
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <ellipse cx="940" cy="220" rx="340" ry="310" fill="url(#aura)"/>
  <path d="M0 1H1200" stroke="url(#accent)" stroke-width="3"/>
  <path d="M32 74H1168M32 376H1168" stroke="#1d303e"/>
  <g class="mono" font-size="12" letter-spacing="2">
